<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFS Learn · Request Initiation</title>
  <meta name="description" content="Interactive gamified POC to learn the IFS Cloud 'Create New Request' process." />
  styles.css
</head>
<body>
  <main class="app">

    <header class="topbar">
      <div class="brand">
        <svg width="66" height="34" viewBox="0 0 66 34" role="img" aria-label="IFS">
          <rect x="0" y="0" width="66" height="34" rx="7" fill="#7c3aed"/>
          <rect x="0" y="0" width="66" height="34" rx="7" fill="url(#g)" opacity="0.35"/>
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#7c3aed"/>
            </linearGradient>
          </defs>
          <text x="33" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
                font-size="19" font-weight="800" letter-spacing="1.5" fill="#ffffff">IFS</text>
        </svg>
        <div>
          <div class="t-title" id="t-title">Request Initiation</div>
          <div class="t-sub" id="t-sub">Create New Request — Interactive Learning POC</div>
        </div>
      </div>
      <div class="spacer"></div>
      <button class="mute-btn" id="muteBtn" title="Mute / unmute sounds" aria-label="Mute or unmute sounds">🔊</button>
      <div class="scorebox">
        <div class="score" id="score">0</div>
        <div class="label">POINTS</div>
      </div>
    </header>

    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="trophy-rail" id="trophyRail"></div>
    </div>

    <div class="map-card">
      <canvas id="road" width="960" height="300" aria-label="First-person driving view"></canvas>
      <div class="speed-badge" id="speedBadge">STOPPED · 0 km/h</div>
    </div>

    <section class="panel" id="panel" aria-live="polite"></section>

    <div class="fidelity">
      <b>Fidelity note (POC):</b> The process steps reflect the IFS Cloud
      <a href="https://docs.ifs.com/ifsclouddocs/26r1/ProcessModels/Process_Model/Requestinitiation.htm" target="_blank" rel="noopener">Request Initiation process model</a>.
      Sample data is illustrative. Logo &amp; colours approximate the IFS brand.
    </div>

  </main>

  sounds.js
  content.js
  game.js
</body>
</html>
